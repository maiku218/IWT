<div class="modal fade" id="workLogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Work Log</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="workLogForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" id="logId" name="log_id">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Work Date</label>
                            <input type="date" name="work_date" id="wlWorkDate" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Task Title</label>
                            <input type="text" name="task_title" id="wlTaskTitle" class="form-control" required maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select name="category" id="wlCategory" class="form-select" required>
                                <option value="">Select category</option>
                                {% for c in categories %}
                                <option value="{{ c }}">{{ c }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select name="status" id="wlStatus" class="form-select" required>
                                <option value="">Select status</option>
                                {% for s in statuses %}
                                <option value="{{ s }}">{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Knowledge/Skills Acquired</label>
                            <textarea name="skills_acquired" id="wlSkillsAcquired" class="form-control" rows="3" placeholder="What knowledge or skills did you gain from this task?" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Work Description</label>
                            <textarea name="description" id="wlDescription" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Attachment (optional)</label>
                            <input type="file" name="attachment" id="wlAttachment" class="form-control" accept=".png,.jpg,.jpeg,.gif,.pdf">
                            <div class="form-text">Allowed: PNG, JPG, GIF, PDF (max 16 MB)</div>
                        </div>
                    </div>
                    <div id="formErrors" class="alert alert-danger d-none mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="wlSaveBtn">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
